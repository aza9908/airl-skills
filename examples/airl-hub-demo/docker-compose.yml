# Демо-хаб AIRL одной командой: docker compose up -d --build
# Перед первым запуском: bash scripts/init_env.sh (создаст .env со случайными паролями; в git не попадает).
# Открыть: http://localhost:8080/login
#
# На боевом сервере хаба (/airl-devops) каждый сервис — свой проект Compose в /srv/hub/<id>/,
# хранилище — /srv/hub/dwh/, прокси — /srv/proxy/ (см. DEVOPS.md). Здесь всё в одном файле для демо.
name: airl-hub-demo

x-svc: &svc
  restart: unless-stopped
  env_file: .env
  networks: [web, dwh]
  depends_on:
    setup:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airl_admin
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD:?запустите scripts/init_env.sh}
      POSTGRES_DB: postgres
      TZ: Asia/Almaty
    volumes: [db_data:/var/lib/postgresql/data]
    networks: [dwh]                     # наружу база не открыта: портов нет
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airl_admin -d postgres"]
      interval: 5s
      retries: 20

  setup:                                # один раз: хранилище, модули, синтетика, пользователи, сводка
    build: { context: ../.., dockerfile: examples/airl-hub-demo/Dockerfile.setup }
    env_file: .env
    environment:
      ADMIN_DATABASE_URL: postgresql://airl_admin:${ADMIN_DB_PASSWORD}@db:5432/postgres
    volumes: [ai_out:/demo/ai/out]
    networks: [dwh]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  hub:
    <<: *svc
    build: { context: ., args: { SERVICE: hub, APP_VERSION: "1.0.0" } }
    image: airl-hub-demo-hub:1.0.0
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://svc_hub:${HUB_DB_PASSWORD}@db:5432/airl_demo_hub
      KEYS_DIR: /app/.secrets
      DIGEST_FILE: /app/ai/out/digest.json
    volumes: [hub_keys:/app/.secrets, ai_out:/app/ai/out:ro]
    ports: ["127.0.0.1:3000:3000"]      # только для проверки с самого сервера

  finance:
    <<: *svc
    build: { context: ., args: { SERVICE: finance, APP_VERSION: "1.0.0" } }
    image: airl-hub-demo-finance:1.0.0
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://svc_finance:${FIN_DB_PASSWORD}@db:5432/airl_demo_hub
      AIRL_JWKS_URL: http://hub:3000/.well-known/jwks.json
    ports: ["127.0.0.1:3001:3001"]

  sales:
    <<: *svc
    build: { context: ., args: { SERVICE: sales, APP_VERSION: "1.0.0" } }
    image: airl-hub-demo-sales:1.0.0
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://svc_sales:${SALES_DB_PASSWORD}@db:5432/airl_demo_hub
      AIRL_JWKS_URL: http://hub:3000/.well-known/jwks.json
    ports: ["127.0.0.1:3002:3002"]

  edu:
    <<: *svc
    build: { context: ., args: { SERVICE: edu, APP_VERSION: "1.0.0" } }
    image: airl-hub-demo-edu:1.0.0
    environment:
      PORT: "3003"
      DATABASE_URL: postgresql://svc_edu:${EDU_DB_PASSWORD}@db:5432/airl_demo_hub
      AIRL_JWKS_URL: http://hub:3000/.well-known/jwks.json
    ports: ["127.0.0.1:3003:3003"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      HUB_SITE: ${HUB_SITE:-:80}         # на сервере: hub.<домен> — Caddy сам выпустит сертификат
    ports: ["${PROXY_PORT:-8080}:80", "443:443"]
    volumes: [./proxy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    networks: [web]
    depends_on: [hub, finance, sales, edu]

volumes:
  db_data:
  hub_keys:
  ai_out:
  caddy_data:

networks:
  web:
  dwh:
