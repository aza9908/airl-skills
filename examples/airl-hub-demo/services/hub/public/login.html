<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161a">
  <title>Вход — хаб AIRL (демо)</title>
  <link rel="icon" href="/assets/star-mark.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/airl-tokens.css">
  <link rel="stylesheet" href="/assets/ui.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body class="login-page">
  <header class="topbar login-top">
    <a class="logo" href="/login" aria-label="AIRL"><img src="/assets/logo-airl-white.png" alt="AIRL" width="69" height="22"></a>
    <span class="spacer"></span>
    <span class="mono tag">hub · демо</span>
  </header>
  <main class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="on" novalidate>
      <img class="star" src="/assets/star-mark.svg" alt="" width="56" height="56">
      <h1>Хаб руководителя</h1>
      <p class="muted">AI Research Labs · Алматы. Демо на синтетических данных, похожих на выгрузки 1С.</p>
      <label for="login">Логин</label>
      <input id="login" name="login" autocomplete="username" required autocapitalize="off" spellcheck="false" placeholder="например, ceo">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="error" id="err" role="alert" hidden></p>
      <button class="btn" type="submit" id="submit">Войти</button>
      <p class="mono hint">Пароль демо-пользователей задаётся при первом запуске (DEMO_PASSWORD) — его выдаёт команда AIRL.</p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
