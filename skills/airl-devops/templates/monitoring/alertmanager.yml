# alertmanager.yml — куда отправлять оповещения. Шаблон навыка airl-devops.
# chat_id — число (для групп начинается с -100). Токен бота — в файле, не здесь.
route:
  receiver: telegram
  group_by: ["alertname", "server"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

inhibit_rules:
  # Сервер молчит — не засыпать чат остальными оповещениями с него
  - source_matchers: ['alertname="ServerMetricsMissing"']
    target_matchers: ['severity="warning"']
    equal: ["server"]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: -1000000000000
        parse_mode: HTML
        send_resolved: true
