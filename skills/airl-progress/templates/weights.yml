# Веса прогресса курса VibeOps для /airl-progress.
# Меняйте числа — скрипт пересчитает процент со следующего запуска.
# Процент участника = сумма по этапам (вес этапа × доля выполненных пунктов этапа).
# Доля пунктов этапа = сумма (вес пункта × оценка 0..1) / сумма весов подходящих пунктов.
# Пункты «только для хаба» у участника со своим продуктом не учитываются (и наоборот).

# Вес этапа в процентах. Сумма — 100.
stages:
  start: 5        # неделя 0: репозиторий и CLAUDE.md
  plan: 20        # неделя 1: SPEC.md, ARCHITECTURE.md, для хаба airl.service.json и карта
  data: 25        # неделя 2: DWH.md, миграции, модуль, PWA, /healthz
  security: 15    # неделя 3: SECURITY.md с вердиктом «можно открывать»
  launch: 25      # неделя 4: Docker, CI, DEVOPS.md, REVIEW.md без блокирующих, живой адрес
  demo: 10        # Demo Day: отметка в SPEC.md (свой продукт) или приёмка в хаб

# Вес пункта внутри этапа (по умолчанию 1). Что значит каждый пункт — references/checklist.md.
items:
  repo: 1
  claude_md: 1
  spec: 1
  spec_pain: 2
  spec_metric: 2
  spec_criteria: 2
  arch_context: 2
  service_json: 1
  company_map: 1
  dwh: 1
  migrations: 2
  module: 1
  pwa_manifest: 1
  pwa_sw: 1
  healthz: 1
  hub_summary: 1
  security_md: 1
  security_ok: 3
  docker: 1
  ci: 1
  devops_md: 1
  review_ok: 2
  live: 2
  demo: 1

thresholds:
  stage_done: 0.75     # этап пройден, если выполнено от 75% его пунктов (с весами)
  stall_days: 4        # «застрял»: столько дней без коммитов или без роста процента
  behind_margin: 15    # «отстаёт»: процент ниже плана больше чем на столько пунктов
  ahead_margin: 10     # «впереди»: процент выше плана на столько пунктов и больше
  median_margin: 20    # дата старта не задана — сравниваем с серединой когорты

schedule:
  # Первый день недели 1, например "2026-11-02". Пусто — сравнение с серединой когорты.
  # Общая дата для всех потоков; у потока из списка cohorts ниже — своя.
  start_date: ""
  # Несколько потоков в одном списке участников (колонка cohort): своя дата старта
  # у каждого. План, «отстаёт» и «впереди» считаются по дате потока участника,
  # а в блоке «Сравнение потоков» линии выравниваются по дням от старта.
  # Поток, которого здесь нет, берёт общий start_date. Дату пишите в кавычках.
  cohorts:
    VibeOps-2026-11:
      start_date: ""
    VibeOps-2026-12:
      start_date: ""
  # Ожидаемый процент: в день старта, в конце недель 1, 2, 3, 4 и к Demo Day (неделя 5).
  expected_end_of_week: [5, 25, 50, 65, 90, 100]
